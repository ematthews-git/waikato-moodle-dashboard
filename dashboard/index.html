<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodle Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10);
    --accent: #2a78d6; --other: #898781;
    --track: color-mix(in srgb, var(--accent) 14%, var(--surface));
    --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
      --accent: #3987e5; --other: #898781;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
    --accent: #3987e5; --other: #898781;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 var(--font); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h1, h2, h3, p { margin: 0; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .muted { color: var(--ink2); }
  .small { font-size: 13px; }

  .card { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); padding: 20px; }
  .card > h2 { font-size: 16px; font-weight: 600; }
  .card > .sub { color: var(--ink2); font-size: 13px; margin-top: 2px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  header h1 { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  header .meta { display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; box-shadow: 0 0 0 1px var(--ring); color: var(--ink2); }
  .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; }
  .icon-btn:hover { background: var(--grid); }

  .filters { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--grid); }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink2); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--ring); }

  .hero { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 20px; }
  .hero .label { font-size: 13px; color: var(--ink2); width: 100%; }
  .hero .num { font-size: 64px; line-height: 1; font-weight: 650; letter-spacing: -.03em; }
  .hero .letter { font-size: 24px; font-weight: 600; color: var(--ink2); }
  .hero .note { font-size: 13px; color: var(--ink2); flex: 1 1 220px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 12px 0 16px; }
  .tile .label { font-size: 13px; color: var(--ink2); }
  .tile .value { font-size: 28px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .tile .value .icon { width: 22px; height: 22px; }
  .tile .note { font-size: 13px; color: var(--ink2); margin-top: 2px; overflow-wrap: anywhere; }

  .cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .stack { display: grid; gap: 16px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--ink2); margin-bottom: 8px; }

  .courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .course { display: grid; gap: 8px; text-decoration: none; padding: 16px; border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 1px var(--ring); }
  .course:hover { box-shadow: 0 0 0 1px var(--axis); }
  .course[aria-current="true"] { box-shadow: 0 0 0 2px var(--accent); }
  .course .code { font-size: 12px; font-weight: 600; color: var(--ink2); letter-spacing: .02em; display: flex; justify-content: space-between; gap: 8px; }
  .course .title { font-weight: 600; line-height: 1.3; }
  .course .grade { display: flex; align-items: baseline; gap: 8px; }
  .course .grade .pct { font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
  .course .grade .none { font-size: 14px; color: var(--ink2); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; box-shadow: 0 0 0 1px var(--ring); color: var(--ink); }
  .chip .icon { width: 14px; height: 14px; }
  .chip.warn .icon { color: var(--warn); } .chip.serious .icon { color: var(--serious); } .chip.crit .icon { color: var(--crit); }
  .meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .meter > span { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }

  .detail-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .detail-head .links { display: flex; gap: 14px; font-size: 13px; }
  .detail-head .links a { display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); }
  .verdict { margin: 14px 0; padding: 12px 14px; border-radius: 8px; background: var(--track); font-size: 14px; }
  .facts { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 16px; }
  .facts .k { font-size: 12px; color: var(--ink2); }
  .facts .v { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }

  .rows { display: grid; }
  .row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(70px, 1.6fr) 52px 74px 56px; gap: 4px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--grid); }
  .row.head { border-top: 0; padding: 0 0 6px; font-size: 12px; color: var(--ink2); }
  .row .name { min-width: 0; }
  .row .name b { font-weight: 550; display: block; overflow-wrap: anywhere; }
  .row .name small { display: block; font-size: 12px; color: var(--ink2); margin-top: 1px; }
  .row .num { text-align: right; font-variant-numeric: tabular-nums; }
  .row .pct { font-weight: 650; }
  .track { position: relative; height: 16px; border-radius: 4px; background: var(--track); }
  .track .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 0 4px 4px 0; transition: opacity .15s; }
  .track .pass { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 1px; background: var(--axis); }
  .row:hover .fill, .row:focus-visible .fill { opacity: .8; }
  @media (max-width: 640px) { .row { grid-template-columns: minmax(0, 1.4fr) minmax(60px, 1fr) 48px 50px; } .row .raw { display: none; } }

  .deadline { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--grid); text-decoration: none; align-items: start; }
  .deadline:first-of-type { border-top: 0; }
  a.deadline:hover b { text-decoration: underline; }
  .deadline b { font-weight: 550; display: block; overflow-wrap: anywhere; }
  .deadline .when { text-align: right; font-size: 13px; color: var(--ink2); white-space: nowrap; }
  .deadline .when strong { display: block; color: var(--ink); font-weight: 600; }
  .deadline .icon.warn { color: var(--warn); } .deadline .icon.crit { color: var(--crit); } .deadline .icon.dim { color: var(--muted); }
  .list { margin-top: 8px; }

  .chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .chart-head .btn { border: 0; box-shadow: 0 0 0 1px var(--ring); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; }
  .chart-head .btn[aria-pressed="true"] { background: var(--grid); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0 4px; font-size: 13px; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chart { margin-top: 4px; }
  .chart svg text { font-family: var(--font); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink2); padding: 0 8px 6px 0; }
  td { padding: 8px 8px 8px 0; border-top: 1px solid var(--grid); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

  #tip { position: fixed; top: 0; left: 0; z-index: 10; pointer-events: none; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: var(--surface); box-shadow: 0 0 0 1px var(--ring), 0 6px 20px rgba(0,0,0,.18); font-size: 13px; }
  #tip[hidden] { display: none; }
  #tip .v { font-size: 16px; font-weight: 650; color: var(--ink); }
  #tip .t { color: var(--ink); font-weight: 550; }
  #tip .s { color: var(--ink2); }

  .empty { text-align: center; padding: 48px 20px; }
  .empty h2 { font-size: 18px; margin-bottom: 8px; }
  .empty code { background: var(--grid); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  footer { margin-top: 24px; font-size: 12px; color: var(--ink2); display: grid; gap: 4px; }
  @media (forced-colors: active) { .track .fill, .meter > span { background: Highlight; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="tip" role="tooltip" hidden></div>

<script>
'use strict';

/* ---------- tiny DOM helpers. Everything goes through textContent, so data can never inject markup. ---------- */
const NS = 'http://www.w3.org/2000/svg';
function build(el, attrs, kids) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const h = (tag, attrs, ...kids) => build(document.createElement(tag), attrs, kids);
const s = (tag, attrs, ...kids) => build(document.createElementNS(NS, tag), attrs, kids);

const ICONS = {
  warn: ['M8 2 14.5 13.5h-13z', 'M8 6.5v3', 'M8 11.7h.01'],
  clock: ['M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12z', 'M8 4.8V8l2.2 1.3'],
  check: ['M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12z', 'M5.5 8.2l1.7 1.7 3.3-3.6'],
  ext: ['M9 2.5h4.5V7', 'M13.5 2.5 7.5 8.5', 'M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3'],
  sun: ['M8 10.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2z', 'M8 1.5v1.4M8 13.1v1.4M1.5 8h1.4M13.1 8h1.4M3.4 3.4l1 1M11.6 11.6l1 1M12.6 3.4l-1 1M4.4 11.6l-1 1'],
  moon: ['M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z'],
  hidden: ['M2 8s2.2-4 6-4 6 4 6 4-2.2 4-6 4-6-4-6-4z', 'M3 13 13 3'],
};
const icon = (name, cls = '') =>
  s('svg', { class: `icon ${cls}`, viewBox: '0 0 16 16', 'aria-hidden': 'true' }, ICONS[name].map(d => s('path', { d })));

const safeHref = u => { try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:' ? x.href : null; } catch { return null; } };

/* ---------- formatting ---------- */
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const n1 = v => String(Math.round(v * 10) / 10);
const pct = v => (v == null ? '—' : `${n1(v)}%`);
const dateFmt = new Intl.DateTimeFormat('en-NZ', { day: 'numeric', month: 'short' });
const dateTimeFmt = new Intl.DateTimeFormat('en-NZ', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const syncFmt = new Intl.DateTimeFormat('en-NZ', { dateStyle: 'medium', timeStyle: 'short' });
function dayDiff(ts) {
  const a = new Date(ts * 1000), b = new Date();
  a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 864e5);
}
const relDay = n => n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n > 0 ? `in ${n} days` : `${-n} days ago`;

/* ---------- state ---------- */
const state = { data: null, error: null, scope: 'current', selected: null, timelineTable: false };
const scoped = () => state.data.courses.filter(c => state.scope === 'all' || c.status !== 'past');
const shortCode = code => String(code || '').split(' ')[0];
const markedCount = c => c.assessments.filter(a => a.percentage != null).length;
const letterFor = p => (state.data.grade_scale.find(g => p >= g.min) || {}).label;
const courseLetter = c => {
  const d = c.grade.display;
  if (d && /^[A-E][+-]?$/.test(d)) return d;
  return c.grade.percentage == null ? null : letterFor(c.grade.percentage);
};
function attention(c) {
  if (c.status === 'past') return null;
  const p = c.projection, g = c.grade.percentage;
  if (p && p.status === 'out_of_reach') return { label: 'Pass out of reach', tone: 'crit' };
  if (g != null && g < state.data.pass_mark) return { label: 'Below pass mark', tone: 'serious' };
  return null;
}
function pickDefault() {
  const list = scoped();
  return (list.find(c => markedCount(c)) || list[0] || {}).id ?? null;
}
function fromHash() {
  const m = /^#c(\d+)$/.exec(location.hash);
  const id = m && Number(m[1]);
  return state.data.courses.some(c => c.id === id) ? id : null;
}

/* ---------- tooltip: one element, every mark gets one ---------- */
const tip = document.getElementById('tip');
function placeTip(x, y) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let left = x + pad, top = y + pad;
  if (left + r.width > innerWidth - 8) left = x - r.width - pad;
  if (top + r.height > innerHeight - 8) top = y - r.height - pad;
  tip.style.transform = `translate(${Math.max(8, left)}px, ${Math.max(8, top)}px)`;
}
function bindTip(el, rows) {
  const show = () => {
    tip.replaceChildren(...rows().map(([cls, text]) => h('div', { class: cls }, text)));
    tip.hidden = false;
  };
  el.addEventListener('pointerenter', e => { show(); placeTip(e.clientX, e.clientY); });
  el.addEventListener('pointermove', e => placeTip(e.clientX, e.clientY));
  el.addEventListener('pointerleave', () => { tip.hidden = true; });
  el.addEventListener('focus', () => { show(); const b = el.getBoundingClientRect(); placeTip(b.left + b.width / 2, b.top); });
  el.addEventListener('blur', () => { tip.hidden = true; });
}

/* ---------- sections ---------- */
function header() {
  const d = state.data;
  const dark = () => document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  return h('header', {},
    h('div', {}, h('h1', {}, d.site.name || 'Moodle'), h('p', { class: 'muted small' }, d.user.name)),
    h('div', { class: 'meta' },
      d.demo && h('span', { class: 'badge' }, 'Demo data: invented'),
      h('button', {
        class: 'icon-btn', 'aria-label': 'Toggle light and dark theme', title: 'Toggle theme',
        onclick: () => {
          const next = dark() ? 'light' : 'dark';
          document.documentElement.dataset.theme = next;
          try { localStorage.setItem('theme', next); } catch {}
          render();
        },
      }, icon(dark() ? 'sun' : 'moon'))));
}

function filters() {
  const btn = (value, label) => h('button', { 'aria-pressed': state.scope === value, onclick: () => setScope(value) }, label);
  return h('div', { class: 'filters' }, h('span', { class: 'muted small' }, 'Show'),
    h('div', { class: 'seg', role: 'group', 'aria-label': 'Which courses' }, btn('current', 'Current'), btn('all', 'All courses')));
}
function setScope(scope) {
  state.scope = scope;
  if (!scoped().some(c => c.id === state.selected)) state.selected = pickDefault();
  render();
}

function hero(courses) {
  const graded = courses.filter(c => c.grade.percentage != null);
  const avg = graded.length ? graded.reduce((t, c) => t + c.grade.percentage, 0) / graded.length : null;
  return h('section', { class: 'card hero', 'aria-label': 'Overall average' },
    h('div', { class: 'label' }, 'Average grade'),
    h('div', { class: 'num' }, pct(avg)),
    avg != null && h('div', { class: 'letter' }, letterFor(avg)),
    h('p', { class: 'note' }, graded.length
      ? `Simple average of ${graded.length} course${graded.length === 1 ? '' : 's'} with grades released. Not weighted by credit points.`
      : 'No grades released yet in these courses.'));
}

function tiles(courses) {
  const ids = new Set(courses.map(c => c.id));
  const all = courses.flatMap(c => c.assessments);
  const marked = all.filter(a => a.percentage != null).length;
  const next = state.data.deadlines.find(d => d.due * 1000 >= Date.now() && (d.course_id == null || ids.has(d.course_id)));
  const code = id => shortCode((state.data.courses.find(c => c.id === id) || {}).code);
  const flagged = courses.map(c => [c, attention(c)]).filter(([, a]) => a);

  const tile = (label, value, note, extra) =>
    h('div', { class: 'card tile' }, h('div', { class: 'label' }, label), h('div', { class: 'value' }, extra, value), h('div', { class: 'note' }, note));
  return h('section', { class: 'tiles', 'aria-label': 'Summary' },
    tile('Courses', String(courses.length), `${courses.filter(c => c.grade.percentage != null).length} with grades released`),
    tile('Assessments marked', `${marked} of ${all.length}`, `${all.length - marked} still to come or hidden`),
    tile('Next deadline', next ? relDay(dayDiff(next.due)) : 'None', next ? `${next.name} · ${code(next.course_id) || ''}` : 'Nothing due soon'),
    tile('Needs attention', flagged.length ? String(flagged.length) : 'None',
      flagged.length ? flagged.map(([c, a]) => `${shortCode(c.code)}: ${a.label.toLowerCase()}`).join('; ') : 'Every course is above the pass mark',
      icon(flagged.length ? 'warn' : 'check', flagged.length ? 'crit' : '')));
}

function courseCard(c) {
  const p = c.projection, flag = attention(c), letter = courseLetter(c);
  return h('a', { class: 'course', href: `#c${c.id}`, 'aria-current': c.id === state.selected ? 'true' : null },
    h('div', { class: 'code' }, h('span', {}, c.code), c.status !== 'current' && h('span', {}, c.status === 'past' ? 'Past' : 'Upcoming')),
    h('div', { class: 'title' }, c.title),
    h('div', { class: 'grade' },
      c.grade.percentage != null ? [h('span', { class: 'pct' }, pct(c.grade.percentage)), letter && h('span', { class: 'chip' }, letter)]
        : h('span', { class: 'none' }, 'No grade yet')),
    p ? [h('div', { class: 'meter', role: 'img', 'aria-label': `${p.graded_weight}% of the course marked` }, h('span', { style: `width:${clamp(p.graded_weight, 0, 100)}%` })),
        h('div', { class: 'small muted' }, `${n1(p.graded_weight)}% of the course marked`)]
      : c.progress != null && h('div', { class: 'small muted' }, `Activity completion ${n1(c.progress)}%`),
    flag && h('span', { class: `chip ${flag.tone}` }, icon('warn'), flag.label));
}

function verdict(c) {
  const p = c.projection, pass = state.data.pass_mark;
  if (!p) return 'The weights in this course can’t be combined reliably, so open the Moodle gradebook for the full picture.';
  if (p.status === 'final') return `Everything is marked. Final result ${pct(p.banked)}.`;
  if (p.status === 'secured') return `Pass secured. Even 0% on the remaining ${n1(p.remaining_weight)}% would keep you at or above ${pass}%.`;
  if (p.status === 'out_of_reach') return `Reaching ${pass}% would need more than 100% on the remaining ${n1(p.remaining_weight)}% (best case is ${n1(p.max_possible)}%). Worth talking to your lecturer or student support early.`;
  if (!p.graded_weight) return `Nothing marked yet. You’ll need ${pass}% overall to pass.`;
  return `You need about ${n1(p.needed_for_pass)}% on the remaining ${n1(p.remaining_weight)}% of the course to reach the ${pass}% pass mark.`;
}

function assessmentRow(a, c) {
  const marked = a.percentage != null;
  const track = h('div', { class: 'track' }, marked && h('div', { class: 'fill', style: `width:${clamp(a.percentage, 0, 100)}%` }), h('span', { class: 'pass' }));
  const sub = a.hidden ? 'Grade hidden by your teacher' : !marked ? 'Not marked yet' : a.feedback;
  const row = h('div', { class: 'row', tabindex: marked ? '0' : null },
    h('div', { class: 'name' }, h('b', {}, a.name), sub && h('small', {}, sub)),
    track,
    h('div', { class: 'num pct' }, marked ? pct(a.percentage) : a.hidden ? icon('hidden') : '—'),
    h('div', { class: 'num raw muted' }, marked && a.max ? `${n1(a.grade)} / ${n1(a.max)}` : ''),
    h('div', { class: 'num muted' }, a.weight != null ? `${n1(a.weight)}%` : '—'));
  if (marked) bindTip(row, () => [
    ['v', pct(a.percentage)],
    ['t', a.name],
    a.max ? ['s', `${n1(a.grade)} out of ${n1(a.max)}`] : null,
    a.weight != null ? ['s', `Weight ${n1(a.weight)}% · adds ${n1(a.percentage * a.weight / 100)} points to the course`] : null,
    a.graded_at ? ['s', `Marked ${dateFmt.format(a.graded_at * 1000)}`] : null,
  ].filter(Boolean));
  return row;
}

function detail(c) {
  if (!c) return null;
  const p = c.projection;
  const link = (url, label) => safeHref(url) && h('a', { href: safeHref(url), target: '_blank', rel: 'noopener noreferrer' }, label, icon('ext'));
  return h('section', { class: 'card', 'aria-label': `${c.code} detail` },
    h('div', { class: 'detail-head' },
      h('div', {}, h('h2', {}, `${c.code} · ${c.title}`),
        h('p', { class: 'sub' }, [c.teachers.length ? c.teachers.join(', ') : null, c.start && c.end ? `${dateFmt.format(c.start * 1000)} to ${dateFmt.format(c.end * 1000)}` : null].filter(Boolean).join(' · '))),
      h('div', { class: 'links' }, link(c.url, 'Course page'), link(c.gradebook_url, 'Gradebook'))),
    h('p', { class: 'verdict' }, verdict(c)),
    p && p.status !== 'final' && h('div', { class: 'facts' },
      fact('Standing so far', pct(p.standing)),
      fact('Points banked', `${n1(p.banked)} / 100`),
      fact('Best possible', pct(p.max_possible))),
    c.assessments.length
      ? h('div', { class: 'rows', role: 'table', 'aria-label': 'Assessments' },
          h('div', { class: 'row head', role: 'row' }, h('span', {}, 'Assessment'), h('span', {}), h('span', { class: 'num' }, 'Mark'), h('span', { class: 'num raw' }, 'Raw'), h('span', { class: 'num' }, 'Weight')),
          c.assessments.map(a => assessmentRow(a, c)))
      : h('p', { class: 'muted' }, 'No assessments are visible in the gradebook for this course.'),
    c.assessments.length > 0 && h('p', { class: 'small muted', style: 'margin-top:10px' }, 'The thin line on each bar is the pass mark.'));
}
const fact = (k, v) => h('div', {}, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v));

function deadlines(courses) {
  const ids = new Set(courses.map(c => c.id));
  const code = id => shortCode((state.data.courses.find(c => c.id === id) || {}).code);
  const list = state.data.deadlines.filter(d => d.course_id == null || ids.has(d.course_id)).slice(0, 10);
  const row = d => {
    const n = dayDiff(d.due), late = d.overdue || d.due * 1000 < Date.now();
    const [ic, tone, label] = late ? ['warn', 'crit', 'Overdue'] : n <= 3 ? ['clock', 'warn', 'Due soon'] : ['clock', 'dim', ''];
    const href = safeHref(d.url);
    return h(href ? 'a' : 'div', { class: 'deadline', href },
      h('span', { title: label || null }, icon(ic, tone)),
      h('div', {}, h('b', {}, d.name), h('span', { class: 'small muted' }, [code(d.course_id), d.action].filter(Boolean).join(' · '))),
      h('div', { class: 'when' }, h('strong', {}, label ? `${label}: ${relDay(n)}` : relDay(n)), dateTimeFmt.format(d.due * 1000)));
  };
  return h('section', { class: 'card', 'aria-label': 'Deadlines' }, h('h2', {}, 'Deadlines'),
    h('p', { class: 'sub' }, 'Things Moodle says you still have to do'),
    list.length ? h('div', { class: 'list' }, list.map(row)) : h('p', { class: 'muted', style: 'margin-top:12px' }, 'Nothing outstanding.'));
}

/* ---------- marks-over-time chart: one dot per marked assessment, selected course highlighted ---------- */
function marksTimeline(courses) {
  const points = courses.flatMap(c => c.assessments.filter(a => a.percentage != null && a.graded_at)
    .map(a => ({ c, a, t: a.graded_at * 1000, y: clamp(a.percentage, 0, 100) }))).sort((p, q) => p.t - q.t);
  const sel = courses.find(c => c.id === state.selected);
  const holder = h('div', { class: 'chart' });
  const head = h('div', { class: 'chart-head' },
    h('div', {}, h('h2', {}, 'Marks over time'), h('p', { class: 'sub' }, 'Each dot is one marked assessment, placed by the date it was marked.')),
    h('button', { class: 'btn', 'aria-pressed': state.timelineTable, onclick: () => { state.timelineTable = !state.timelineTable; render(); } }, 'Table view'));
  const card = h('section', { class: 'card', 'aria-label': 'Marks over time' }, head);

  if (points.length < 2) {
    card.append(h('p', { class: 'muted', style: 'margin-top:12px' }, 'Needs at least two marked assessments to draw a timeline.'));
    return card;
  }
  if (state.timelineTable) {
    card.append(h('div', { class: 'chart' }, h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, 'Marked'), h('th', {}, 'Course'), h('th', {}, 'Assessment'), h('th', { class: 'n' }, 'Mark'))),
      h('tbody', {}, points.map(p => h('tr', {}, h('td', {}, dateFmt.format(p.t)), h('td', {}, shortCode(p.c.code)), h('td', {}, p.a.name), h('td', { class: 'n' }, pct(p.a.percentage))))))));
    return card;
  }
  card.append(h('div', { class: 'legend' },
    sel && h('span', {}, h('i', { style: 'background:var(--accent)' }), `${shortCode(sel.code)} (selected)`),
    h('span', {}, h('i', { style: 'background:var(--other)' }), sel ? 'Other courses' : 'Courses')), holder);
  requestAnimationFrame(() => drawTimeline(holder, points, sel));
  return card;
}

function drawTimeline(holder, points, sel) {
  const W = Math.max(280, holder.clientWidth), H = 240, m = { t: 14, r: 40, b: 30, l: 40 };
  const day = 864e5, span = points.at(-1).t - points[0].t, padT = Math.max(span * 0.05, 3 * day);
  const d0 = points[0].t - padT, d1 = points.at(-1).t + padT;
  const x = t => m.l + (t - d0) / (d1 - d0) * (W - m.l - m.r);
  const y = v => m.t + (1 - v / 100) * (H - m.t - m.b);

  const months = [];
  for (let d = new Date(d0); ; ) {
    d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    if (d.getTime() > d1) break;
    months.push(d.getTime());
  }
  const stride = Math.ceil(months.length / Math.max(2, Math.floor((W - m.l) / 90)));
  const monthFmt = new Intl.DateTimeFormat('en-NZ', { month: 'short' });

  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Scatter of assessment marks over time; a table view is available' });
  for (const v of [0, 25, 50, 75, 100]) { // gridlines; the pass mark gets its own emphasised line below
    svg.append(
      s('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }),
      s('text', { x: m.l - 8, y: y(v), dy: '.32em', 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' }, String(v)));
  }
  svg.append(s('line', { x1: m.l, x2: W - m.r, y1: y(state.data.pass_mark), y2: y(state.data.pass_mark), stroke: 'var(--axis)', 'stroke-width': 1 }));
  svg.append(s('text', { x: W - m.r + 8, y: y(state.data.pass_mark), dy: '.32em', 'font-size': 11, fill: 'var(--muted)' }, 'pass')); // in the margin so no dot can sit on it
  months.forEach((t, i) => i % stride === 0 && svg.append(s('text', { x: x(t), y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted)' }, monthFmt.format(t))));

  const ordered = [...points.filter(p => p.c !== sel), ...points.filter(p => p.c === sel)]; // selected on top
  for (const p of ordered) {
    const on = p.c === sel, label = `${p.a.name}, ${shortCode(p.c.code)}: ${pct(p.a.percentage)}`;
    const g = s('g', { tabindex: '0', role: 'img', 'aria-label': label, style: 'outline-offset:2px' },
      s('circle', { cx: x(p.t), cy: y(p.y), r: 12, fill: 'transparent' }), // generous hit target
      s('circle', { cx: x(p.t), cy: y(p.y), r: 5, fill: on || !sel ? 'var(--accent)' : 'var(--other)', stroke: 'var(--surface)', 'stroke-width': 2 }));
    bindTip(g, () => [['v', pct(p.a.percentage)], ['t', p.a.name], ['s', `${shortCode(p.c.code)} · marked ${dateFmt.format(p.t)}`]]);
    svg.append(g);
  }
  const last = sel && points.filter(p => p.c === sel).at(-1);
  if (last) svg.append(s('text', { x: clamp(x(last.t), m.l + 14, W - m.r - 14), y: y(last.y) - 12, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: 'var(--ink)' }, pct(last.y)));
  holder.replaceChildren(svg);
}

function footer() {
  const d = state.data;
  return h('footer', {},
    h('div', {}, `Synced ${syncFmt.format(d.generated_at * 1000)} from ${d.site.url}${d.site.release ? ` (Moodle ${d.site.release.split(' ')[0]})` : ''}. This page reads a file on your computer; nothing is sent anywhere.`),
    d.warnings.length > 0 && h('div', {}, `Some data couldn't be fetched: ${d.warnings.join('; ')}`),
    h('div', {}, 'Pass mark, letter grades and the “what do I need” maths are estimates from the marks Moodle shows you. Your course outline is the authority.'));
}

function empty() {
  return h('div', { class: 'card empty' }, h('h2', {}, 'No data yet'),
    h('p', { class: 'muted' }, 'Run ', h('code', {}, 'python -m moodle_dash sync'), ' and reload, or try ', h('code', {}, 'python -m moodle_dash serve --demo'), '.'));
}

/* ---------- render ---------- */
function render() {
  const app = document.getElementById('app');
  tip.hidden = true;
  if (!state.data) return app.replaceChildren(h('header', {}, h('h1', {}, 'Moodle Dashboard')), empty());
  const courses = scoped();
  const sel = courses.find(c => c.id === state.selected);
  app.replaceChildren(
    header(), filters(), hero(courses), tiles(courses),
    h('div', { class: 'cols' },
      h('div', { class: 'stack' },
        h('div', {}, h('div', { class: 'section-title' }, 'Courses'),
          courses.length ? h('div', { class: 'courses' }, courses.map(courseCard)) : h('p', { class: 'muted' }, 'No courses in this view.')),
        detail(sel)),
      deadlines(courses)),
    h('div', { style: 'margin-top:16px' }, marksTimeline(courses)),
    footer());
}

async function init() {
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.data = await res.json();
  } catch (e) { state.error = e; }
  if (state.data) {
    const fromUrl = fromHash();
    state.selected = fromUrl ?? pickDefault();
    const c = state.data.courses.find(c => c.id === state.selected);
    if (c && c.status === 'past') state.scope = 'all';
  }
  render();
}
addEventListener('hashchange', () => { if (!state.data) return; const id = fromHash(); if (id != null) { state.selected = id; render(); } });
let lastWidth = innerWidth, resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (innerWidth !== lastWidth) { lastWidth = innerWidth; if (state.data) render(); } }, 150); });
init();
</script>
</body>
</html>
